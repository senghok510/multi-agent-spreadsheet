[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spreadsheet-agents"
version = "0.1.0"
description = "Multi-agent spreadsheet automation with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.10",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
spreadsheet-agents = "spreadsheet_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spreadsheet_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
